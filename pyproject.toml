[project]
name = "csb-thesis"
version = "0.1.0"
description = "LINE chatbot: a Thai Traditional Medicine self-care advisor with tongue-photo assessment and doctor-style memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "inference-sdk>=1.3.3",
    "langchain-anthropic>=1.4.8",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.4.8",
    "langchain-google-genai>=4.2.6",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.3.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.7",
    "line-bot-sdk>=3.24.0",
    "motor>=3.7.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
